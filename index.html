<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geoscientific AR Project</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        /* Camera feed sits behind the 3D canvas */
        #cameraFeed {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: -1; 
        }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui { 
            position: absolute; top: 12px; left: 12px; color: #ffffff; 
            font-family: Arial, sans-serif; background: rgba(0, 0, 0, 0.65);
            padding: 10px 14px; border-radius: 6px; line-height: 1.5;
            z-index: 10; pointer-events: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            margin: -6px 0 0 -6px; border: 2px solid #00ff00; border-radius: 50%;
            z-index: 10; pointer-events: none;
        }
        #startBtn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; font-size: 18px; font-weight: bold;
            background-color: #007bff; color: white; border: none; border-radius: 8px;
            z-index: 20; cursor: pointer;
        }
    </style>
</head>
<body>
    <video id="cameraFeed" autoplay playsinline></video>
    <div id="ui">Awaiting AR initialization...</div>
    <div id="crosshair"></div>
    <button id="startBtn">Start AR Mode</button>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- DeviceOrientationControls links phone sensors to the camera -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="app.js"></script>
</body>
</html>
