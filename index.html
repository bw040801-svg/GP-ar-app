<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geoscientific AR Project</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }
        #cameraFeed { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui { 
            position: absolute; top: 12px; left: 12px; color: #ffffff; 
            font-family: Arial, sans-serif; background: rgba(0, 0, 0, 0.65);
            padding: 10px 14px; border-radius: 6px; line-height: 1.5;
            z-index: 10; max-width: 320px; pointer-events: none;
        }
        
        /* New dedicated explanation box below the main UI */
        #explanationBox {
            position: absolute; top: 120px; left: 12px; color: #ffffff;
            font-family: Arial, sans-serif; background: rgba(0, 0, 0, 0.8);
            padding: 10px 14px; border-radius: 6px; line-height: 1.4;
            z-index: 10; max-width: 320px; pointer-events: none;
            font-size: 0.9em; border-left: 4px solid #007bff;
            display: none; /* Hidden until a rock is targeted */
        }

        #bottomSliders { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 70%; max-width: 600px; background: rgba(0, 0, 0, 0.65); 
            padding: 15px; border-radius: 8px; color: white; font-family: Arial, sans-serif; 
            z-index: 10; pointer-events: auto; display: none; box-sizing: border-box;
        }
        .slider-row { display: flex; flex-direction: column; margin-bottom: 15px; }
        .slider-row:last-child { margin-bottom: 0; }
        .slider-row input { width: 100%; margin-top: 5px; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            margin: -6px 0 0 -6px; border: 2px solid #00ff00; border-radius: 50%;
            z-index: 10; pointer-events: none;
        }
        
        #startBtn {
            position: absolute; bottom: 50%; left: 50%; transform: translate(-50%, 50%);
            padding: 15px 30px; font-size: 18px; font-weight: bold;
            background-color: #007bff; color: white; border: none; border-radius: 8px;
            z-index: 20; cursor: pointer;
        }
    </style>
</head>
<body>
    <video id="cameraFeed" autoplay playsinline></video>
    
    <div id="ui">
        <div id="infoText">Awaiting AR initialization...</div>
        <div id="gpsText" style="font-size: 0.8em; color:#aaa; margin-top: 5px;">GPS: Waiting...</div>
    </div>
    <div id="explanationBox"></div>
    
    <div id="bottomSliders">
        <div class="slider-row">
            <label for="viewDistance">Render Distance: <span id="distVal">3000</span>m</label>
            <input type="range" id="viewDistance" min="500" max="15000" step="500" value="3000">
        </div>
        <div class="slider-row">
            <label for="opacitySlider">Terrain Transparency: <span id="opacityVal">0.65</span></label>
            <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="0.65">
        </div>
    </div>

    <div id="crosshair"></div>
    <button id="startBtn">Start AR Mode</button>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
    
    <!-- Proj4js for projecting GPS WGS84 to HK1980 Grid -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
